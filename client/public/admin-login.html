<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Admin Login - Barrel Delivery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(to bottom right, #f0f4ff, #e0e7ff);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .lock-icon {
            width: 48px;
            height: 48px;
            background: #2563eb;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 24px;
        }
        
        .header h1 {
            font-size: 24px;
            color: #1f2937;
            margin-bottom: 8px;
        }
        
        .header p {
            font-size: 14px;
            color: #6b7280;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        input {
            width: 100%;
            padding: 10px 12px 10px 36px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        
        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 16px;
        }
        
        .error-message {
            display: none;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 20px;
            color: #991b1b;
            font-size: 14px;
        }
        
        .error-message.show {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        
        .error-icon {
            flex-shrink: 0;
            margin-top: 2px;
        }
        
        .error-text {
            flex: 1;
        }
        
        .error-text p:first-child {
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        button {
            width: 100%;
            padding: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        button:hover:not(:disabled) {
            background: #1d4ed8;
        }
        
        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: none;
        }
        
        button:disabled .spinner {
            display: block;
        }
        
        button:disabled .button-text {
            display: none;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        
        .back-link a:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="lock-icon">🔒</div>
                <h1>Restaurant Admin</h1>
                <p>Enter your credentials to access the admin dashboard</p>
            </div>
            
            <div class="error-message" id="errorMessage">
                <div class="error-icon">⚠️</div>
                <div class="error-text">
                    <p>Login Failed</p>
                    <p id="errorText"></p>
                </div>
            </div>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="username" placeholder="Enter your username" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔑</span>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>
                
                <button type="submit" id="submitBtn">
                    <span class="spinner"></span>
                    <span class="button-text">Login to Admin Dashboard</span>
                </button>
            </form>
            
            <div class="back-link">
                <a href="/">Back to Home</a>
            </div>
        </div>
    </div>
    
    <script>
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorMessage = document.getElementById('errorMessage');
            
            submitBtn.disabled = true;
            errorMessage.classList.remove('show');
            
            try {
                const response = await fetch('/api/trpc/system.login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        json: {
                            username,
                            password,
                            role: 'admin'
                        }
                    }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.result && data.result.data) {
                    const { sessionToken, role, username: returnedUsername } = data.result.data;
                    
                    // Store session tokens
                    localStorage.setItem('systemSessionToken', sessionToken);
                    localStorage.setItem('systemRole', role);
                    localStorage.setItem('systemUsername', returnedUsername);
                    sessionStorage.setItem('systemSessionToken', sessionToken);
                    sessionStorage.setItem('systemRole', role);
                    sessionStorage.setItem('systemUsername', returnedUsername);
                    
                    // Show success message
                    alert('Login successful! Redirecting to admin dashboard...');
                    
                    // Redirect to admin dashboard
                    window.location.href = '/admin/dashboard';
                } else {
                    throw new Error(data.result?.error?.message || 'Login failed');
                }
            } catch (error) {
                console.error('Login error:', error);
                document.getElementById('errorText').textContent = error.message || 'Invalid credentials';
                errorMessage.classList.add('show');
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
